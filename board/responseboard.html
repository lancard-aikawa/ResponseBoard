<title>ResponseBoard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the latest signal on top, then the history axis (sections as a flow of runs), then three
   cards for the chosen point in time: past (what was done / not done), present (section and whole
   project at that time), future (next and questions). Details stay folded. */
:root {
  --bg: #eef2f4; --surface: #ffffff; --sunk: #e4eaee; --fg: #16212a; --muted: #566573; --line: #cdd6dd;
  --accent: #1b5f84; --accent-fg: #ffffff; --accent-soft: #dceaf2;
  --ok: #1d7646; --ok-soft: #ddf0e5; --warn: #9a5800; --warn-soft: #fbecd2;
  --bad: #b3261e; --bad-soft: #f8dfdc; --run: #2c58b0; --run-soft: #e0e7f7;
  --add: #1d7646; --add-soft: #e3f4ea; --del: #b3261e; --del-soft: #fbe6e3;
  --font-body: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --surface: #17202a; --sunk: #121a22; --fg: #e4ebf1; --muted: #98a7b5; --line: #2b3744;
  --accent: #6cb2dc; --accent-fg: #0a1620; --accent-soft: #1b3142;
  --ok: #5ccc8c; --ok-soft: #163325; --warn: #efb24f; --warn-soft: #382a11;
  --bad: #ff8a80; --bad-soft: #3b1b19; --run: #8eb0ff; --run-soft: #1c2946;
  --add: #5ccc8c; --add-soft: #14301f; --del: #ff8a80; --del-soft: #3a1a18; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --sunk: #121a22; --fg: #e4ebf1; --muted: #98a7b5; --line: #2b3744;
  --accent: #6cb2dc; --accent-fg: #0a1620; --accent-soft: #1b3142;
  --ok: #5ccc8c; --ok-soft: #163325; --warn: #efb24f; --warn-soft: #382a11;
  --bad: #ff8a80; --bad-soft: #3b1b19; --run: #8eb0ff; --run-soft: #1c2946;
  --add: #5ccc8c; --add-soft: #14301f; --del: #ff8a80; --del-soft: #3a1a18; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { font-weight: 700; font-size: 16px; }
.proj { color: var(--muted); }
.top .spacer { flex: 1; }

/* not clickable: flat tags (no border) */
.tag { font-size: 12px; padding: 1px 8px; border-radius: 3px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.live { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.tag b { color: var(--fg); }
.tag.d-task { background: var(--run-soft); color: var(--run); }
.tag.d-left { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.ledger-h { font-size: 12.5px; font-weight: 700; margin-top: 6px; }
.flow-legend { margin-top: 2px; }
.flow-legend .mark { font-size: 12px; }
.runq { font: inherit; font-size: 14px; width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--fg); }
.runlist { display: grid; gap: 4px; grid-auto-rows: max-content; }
.runrow { font: inherit; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; cursor: pointer;
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.runrow:hover, .runrow:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
.runrow.hit { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.runrow .grow { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.kroute { font-size: 12.5px; margin: 4px 0 0; padding-left: 1.2em; }
.row.lrow { flex-wrap: wrap; row-gap: 2px; }
.row.lrow > .grow { flex: 1 1 15em; }
.row.lrow .tag { white-space: normal; }
.plus { color: var(--add); } .minus { color: var(--del); }

/* clickable: border or fill, pointer, hover / press / focus change */
.btn { font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent);
  transition: background .12s, transform .05s; text-align: left; }
.btn:hover { background: var(--accent-soft); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .node:focus-visible, .sec-btn:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.btn.small { padding: 2px 9px; font-size: 12.5px; }
/* kinds of buttons: dialog openers end with ⤢, filters are pills (filled while on), moves carry ◀ ▶,
   and only "答えをコピー" and "最新に戻る" are filled (primary) */
.btn.dlg-open::after { content: "⤢"; font-size: .95em; opacity: .85; }
.btn .cnt { font-size: 12.5px; padding: 0 6px; border-radius: 999px; background: var(--sunk); color: var(--fg); }
.btn .cnt .plus, .btn .cnt .minus { font-weight: 700; }
.btn.filter { border-radius: 999px; }
.tabs { display: inline-flex; border: 1px solid var(--accent); border-radius: 6px; overflow: hidden; }
.tabs .tab { font: inherit; font-size: 13px; padding: 3px 12px; border: 0; background: var(--surface); color: var(--accent); cursor: pointer; }
.tabs .tab + .tab { border-left: 1px solid var(--accent); }
.tabs .tab:hover { background: var(--accent-soft); }
.tabs .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); cursor: default; }
.tabs .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; background: var(--surface); }
.select { font: inherit; font-size: 14px; cursor: pointer; padding: 6px 10px; border-radius: 6px;
  border: 1px solid var(--accent); background: var(--surface); color: var(--fg); max-width: 100%; }
.select:hover { background: var(--accent-soft); }
.select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* status colors: shape (● ▲ ✕ ◐) carries the meaning, color repeats it */
.s-done { --c: var(--ok); --c-soft: var(--ok-soft); }
.s-needs_you { --c: var(--warn); --c-soft: var(--warn-soft); }
.s-failed { --c: var(--bad); --c-soft: var(--bad-soft); }
.s-running { --c: var(--run); --c-soft: var(--run-soft); }
.mark { color: var(--c); }

/* latest signal (always the newest run, whatever point is chosen below) */
.signal { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: var(--surface);
  border: 1px solid var(--line); border-left: 8px solid var(--c); border-radius: var(--r); padding: 10px 16px; }
.lamp { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--c-soft); color: var(--c); font-size: 19px; flex: none; }
.sig-label { font-weight: 700; font-size: 13px; color: var(--c); white-space: nowrap; }
.sig-title { font-size: 17px; font-weight: 700; margin: 0; min-width: 0; flex: 1 1 220px; }
.viewing { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 14px; border-radius: var(--r);
  background: var(--accent-soft); border: 1px dashed var(--accent); font-size: 14px; }

/* history axis: one lane per section, runs as a chain of nodes, lanes joined top to bottom */
.flow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: grid; gap: 8px; }
.flow-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.flow-h h2 { font-size: 15px; margin: 0; }
.flow-h .spacer { flex: 1; }
.lanes { display: grid; gap: 0; }
.lane { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 10px; align-items: center; padding: 4px 0; }
.lane + .lane { border-top: 1px dashed var(--line); }
.sec-btn { font: inherit; font-size: 13px; cursor: pointer; text-align: left; padding: 5px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--sunk); color: var(--fg); display: grid; gap: 0; min-width: 0; transition: background .12s, border-color .12s; }
.sec-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.sec-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.sec-btn .sec-id { font-weight: 700; }
.sec-btn .sec-sub { font-size: 12px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; min-width: 0; }
.link { width: 14px; height: 2px; background: var(--line); flex: none; }
.node { font: inherit; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 14px; line-height: 1; border: 2px solid var(--c); background: var(--c-soft); color: var(--c); transition: transform .08s, opacity .12s; }
.node:hover { transform: scale(1.15); }
.node[aria-pressed="true"] { background: var(--c); color: var(--surface); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--c); }
.node.dim { opacity: .28; }
.node.now { border-style: dashed; }
.node.s-running { font-size: 19px; }
.flow-cap { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.older summary { width: fit-content; }

/* the three cards */
.ppf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.card3 { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--k); border-radius: var(--r);
  padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0; }
.k-past { --k: var(--muted); } .k-now { --k: var(--accent); } .k-next { --k: var(--warn); }
.c3-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.c3-h h2 { font-size: 16px; margin: 0; }
.c3-h .ico { font-size: 18px; }
.c3-h .sub { font-size: 13px; color: var(--muted); }
.lead { font-size: 16px; font-weight: 700; margin: 0; display: flex; gap: 8px; align-items: baseline; }
.lead .mark { flex: none; }
.para { margin: 0; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* folded details: the summary is a bordered button */
details.fold { border-top: 1px solid var(--line); padding-top: 8px; }
details.fold > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; width: fit-content; max-width: 100%;
  font-size: 13.5px; padding: 3px 10px; border: 1px solid var(--accent); border-radius: 6px; color: var(--accent); background: var(--surface); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; font-size: 10px; }
details.fold[open] > summary::before { content: "▾"; }
details.fold > summary:hover { background: var(--accent-soft); }
.fold-body { display: grid; gap: 6px; padding-top: 8px; font-size: 14px; }
.row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.row code, code.path { font-family: var(--font-num); font-size: 12.5px; overflow-wrap: anywhere; }
.row .grow { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.kind { font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--sunk); color: var(--muted); flex: none; }
.r-pass { color: var(--ok); } .r-fail { color: var(--bad); } .r-skip { color: var(--muted); }
.why { color: var(--muted); font-size: 13px; }

/* progress bars */
.prog { display: grid; gap: 4px; }
.prog-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13.5px; }
.prog-h b { min-width: 0; overflow-wrap: anywhere; }
.segs { display: flex; gap: 3px; height: 10px; }
.seg { flex: 1; border-radius: 2px; background: var(--sunk); }
.seg.done { background: var(--ok); }
.seg.doing { background: repeating-linear-gradient(45deg, var(--run), var(--run) 5px, var(--run-soft) 5px, var(--run-soft) 10px); }
.seg.blocked { background: var(--bad); }
.stack { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.stack span { display: block; height: 100%; }
.c-done { background: var(--ok); } .c-review { background: var(--warn); } .c-doing { background: var(--run); } .c-todo { background: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

/* kanban inside the present card */
.kan { display: grid; gap: 8px; }
.kcol-h { font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; gap: 6px; }
.kcard { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 6px; padding: 6px 9px; display: grid; gap: 4px; font-size: 13.5px; }
.kcard.col-review { --c: var(--warn); } .kcard.col-doing { --c: var(--run); } .kcard.col-done { --c: var(--ok); }
.kcard.col-done .kt { color: var(--muted); }
.kcard.hit { outline: 2px solid var(--accent); outline-offset: -1px; }
.kcard .km { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kcard details summary { list-style: none; cursor: pointer; width: fit-content; font-size: 12px; padding: 0 8px; border: 1px solid var(--accent); border-radius: 4px; color: var(--accent); }
.kcard details summary::-webkit-details-marker { display: none; }
.kcard details summary:hover { background: var(--accent-soft); }
.kcard details p { margin: 4px 0 0; font-size: 13px; }
.next-tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 3px; background: var(--accent); color: var(--accent-fg); }

/* future */
.ask { display: grid; gap: 6px; padding: 8px 10px; border-radius: 6px; background: var(--warn-soft); border: 1px solid var(--warn); }
.ask.past { background: var(--sunk); border-color: var(--line); }
.ask-q { font-weight: 700; font-size: 14px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.rec { font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--sunk); color: var(--muted); }
.btn[aria-pressed="true"] .rec { background: transparent; color: inherit; opacity: .85; }
.ask-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hint { font-size: 12.5px; color: var(--muted); }
#copy-fallback { width: 100%; min-height: 4.5em; font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); padding: 8px; }
.steps-ol { margin: 0; padding-left: 1.5em; display: grid; gap: 2px; font-size: 14px; }
.steps-ol li::marker { font-family: var(--font-num); color: var(--muted); }

/* diff */
.diff-file { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.diff-file > summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; background: var(--sunk); font-size: 13px; }
.diff-file > summary::-webkit-details-marker { display: none; }
.diff-file > summary::before { content: "▸"; font-size: 10px; color: var(--accent); }
.diff-file[open] > summary::before { content: "▾"; }
.diff-file > summary:hover { background: var(--accent-soft); }
pre.diff { margin: 0; padding: 6px 0; overflow-x: auto; font-family: var(--font-num); font-size: 12px; line-height: 1.5; max-height: 420px; }
pre.diff span { display: block; padding: 0 10px; white-space: pre; }
pre.diff .a { background: var(--add-soft); color: var(--add); }
pre.diff .d { background: var(--del-soft); color: var(--del); }
pre.diff .hk { color: var(--accent); }
pre.diff .mt { color: var(--muted); }
.talk { display: grid; gap: 8px; }
.msg { border-radius: var(--r); padding: 6px 10px; max-width: 100%; min-width: 0; }
.msg .who { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
.msg .say { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.6; }
.msg.user { background: var(--accent-soft); justify-self: end; max-width: 92%; }
.msg.assistant { background: var(--sunk); }
.msg .say.long { max-height: 18em; overflow-y: auto; }
details.ops > summary { list-style: none; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; width: fit-content;
  font-size: 12.5px; color: var(--muted); padding: 2px 8px; border: 1px dashed var(--line); border-radius: 999px; }
details.ops > summary::-webkit-details-marker { display: none; }
details.ops > summary::before { content: "▸"; font-size: 10px; }
details.ops[open] > summary::before { content: "▾"; }
details.ops > summary:hover { background: var(--accent-soft); color: var(--fg); }
details.ops .op { font-family: var(--font-num); font-size: 12px; color: var(--muted); padding: 1px 0 1px 18px; overflow-wrap: anywhere; }
details.ops .op.edit { color: var(--fg); }
details.ops button.op { display: block; width: 100%; text-align: left; font: inherit; font-family: var(--font-num); font-size: 12px;
  background: none; border: 0; border-left: 2px solid var(--accent); margin: 1px 0 1px 12px; padding: 1px 6px; color: var(--accent); cursor: pointer; width: calc(100% - 12px); }
details.ops button.op:hover { background: var(--accent-soft); text-decoration: underline; }
.diff-file.hit { outline: 2px solid var(--accent); }
.dlg .kanboard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.dlg .kanboard .kcol { display: grid; gap: 8px; align-content: start; background: var(--sunk); border-radius: 8px; padding: 8px; min-height: 60px; }
@media (max-width: 760px) { .dlg .kanboard { grid-template-columns: minmax(0, 1fr); } }
/* conversation dialog */
dialog.dlg { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--fg);
  width: min(960px, calc(100% - 16px)); max-width: none; height: min(88vh, 1000px); max-height: none; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
dialog.dlg[open] { display: flex; flex-direction: column; }
dialog.dlg::backdrop { background: rgba(10, 18, 26, .55); }
.dlg-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { font-size: 16px; margin: 0; }
.dlg-h .t { min-width: 0; flex: 1 1 260px; overflow-wrap: anywhere; font-size: 14px; }
.dlg-b { flex: 1; overflow-y: auto; padding: 14px; display: grid; align-content: start; grid-auto-rows: max-content; gap: 10px; }
.dlg-f { padding: 8px 14px; border-top: 1px solid var(--line); }
.dlg .msg { padding: 8px 14px; }
.dlg .msg.user { max-width: 80%; }
.dlg pre.diff { max-height: none; }
.dlg-b > .diff-file + .diff-file { margin-top: -2px; }
@media (max-width: 560px) { dialog.dlg { height: calc(100% - 16px); } .dlg .msg.user { max-width: 100%; } }
/* markdown in messages */
.md { font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md .tbl { margin: 0 0 8px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: 15px; margin: 12px 0 6px; }
.md h1, .md h2 { font-size: 16px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.md ul, .md ol { padding-left: 1.4em; } .md li { margin: 2px 0; }
.md code { font-family: var(--font-num); font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.md pre { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.md pre code { border: 0; padding: 0; background: none; white-space: pre; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
.md .tbl { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--surface); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
.md a { color: var(--accent); text-decoration: underline; }
#err { color: var(--bad); font-size: 13px; }

@media (max-width: 980px) { .ppf { grid-template-columns: minmax(0, 1fr); } }

  const kids = [h("div", { class: "c3-h" }, h("span", { class: "ico", "aria-hidden": "true" }, ICON.now), h("h2", null, "現在"),
    h("span", { class: "sub" }, sel != null && String(sel) !== String(latestId()) ? `${fmt(s.run.finished_at)} 時点の状態` : "いまの状態"))];
  if (sec) {
    const done = sec.steps.filter(x => x.state === "done").length;
    kids.push(h("div", { class: "prog" },
      h("div", { class: "prog-h" }, h("b", null, "取り組み範囲: ", sec.title), h("span", { class: "num" }, `段取り ${done}/${sec.steps.length}`)),
      h("div", { class: "segs", role: "img", "aria-label": `${sec.steps.length} 段のうち ${done} 段が完了` }, sec.steps.map(x => h("span", { class: `seg ${x.state}`, title: `${STEP[x.state]} ${x.title}` }))),
      h("div", { class: "chips" }, h("button", { class: "btn small filter", type: "button", "aria-pressed": fSection === sid ? "true" : "false",
        onclick: () => { fSection = fSection === sid ? null : sid; render(); } }, fSection === sid ? "絞り込み中 ✕" : "履歴をこの範囲で絞る"))));
  }
  if (tasks.length) {
    const cnt = Object.fromEntries(COLS.map(([k]) => [k, tasks.filter(t => t.column === k).length]));
    kids.push(h("div", { class: "prog" },
      h("div", { class: "prog-h" }, h("b", null, "プロジェクト全体"), h("span", { class: "num" }, `完了 ${cnt.done}/${tasks.length}`)),
      h("div", { class: "stack", role: "img", "aria-label": COLS.map(([k, n]) => `${n} ${cnt[k]}`).join("、") },
        ["done", "review", "doing", "todo"].map(k => cnt[k] ? h("span", { class: `c-${k}`, style: `width:${cnt[k] / tasks.length * 100}%` }) : null)),
      h("div", { class: "legend" }, ["done", "review", "doing", "todo"].map(k => h("span", null, h("i", { class: `c-${k}` }), `${COLNAME[k]} `, h("b", { class: "num" }, cnt[k]))))));
  }
  if (sec) kids.push(...ledgerBlock(sid));
  if (sec) kids.push(fold("steps", `段取り（${sec.steps.length}）`, sec.steps.map(x => h("div", { class: "row" }, h("span", { style: "flex:none" }, STEP[x.state]), h("span", { class: "grow", style: x.state === "doing" ? "font-weight:700" : null }, x.title)))));
  if (tasks.length) {
    const n = nodes().find(x => String(x.id) === String(snap.id)) || { id: snap.id };
    kids.push(h("div", { class: "chips" }, dlgButton("kanban", { ...n, kanban: fSection != null ? tasks.filter(t => t.section === fSection).length : tasks.length }),
      dlgButton("left", { ...n, left: leftCount(upToChosen()) })));
  } else {
    const n = nodes().find(x => String(x.id) === String(snap.id)) || { id: snap.id };
    kids.push(h("div", { class: "chips" }, dlgButton("left", { ...n, left: leftCount(upToChosen()) })));
  }
  if (kids.length === 1) kids.push(h("p", { class: "hint" }, "取り組み範囲（section）もタスク（tasks）も書かれていません。"));
  put(el, ...kids);
}

// Left-over items grouped by where they went; secTag adds the section of each item (the whole-project list).
function leftGroups(items, secTag) {
  const by = k => items.filter(x => x.state === k);
  const later = Object.fromEntries(leftovers(nodes()).map(x => [x.title, x]));  // looking back: where it went afterwards
  const group = (name, xs, row) => xs.length > 0 && [h("div", { class: "ledger-h" }, `${name}（${xs.length}）`), xs.map(row)];
  const why = x => x.reason && h("span", { class: "why" }, ` — ${x.reason}`);
  const sec = x => secTag && x.run.section_id && h("span", { class: "tag" }, x.run.section_id);
  return [
    group(`${ICON.left} 置き去り（行き先未定）`, by("left"), x => h("div", { class: "row lrow" }, h("span", { class: "grow" }, x.title, why(x)),
      later[x.title]?.state !== "left" && destTag(x, later[x.title]), sec(x), h("span", { class: "tag num" }, fmt(x.run.finished_at)), goRun(x.run))),
    group(`→ ${ICON.kanban} 続きはタスクへ`, by("task"), x => h("div", { class: "row lrow" }, h("span", { class: "grow" }, x.title), destTag(x), sec(x))),
    group(`${ICON.drop} やらないと決めた`, by("drop"), x => h("div", { class: "row lrow" }, h("span", { class: "grow" }, x.title, why(x)), sec(x))),
  ];
}
function leftView(n) {
  const all = nodes(), i = all.findIndex(x => String(x.id) === String(n.id));
  const items = leftovers(i < 0 ? all : all.slice(0, i + 1));
  if (!items.length) return h("div", { class: "hint" }, "残したこと（run.not_done）はまだありません。");
  return [h("div", { class: "hint" }, "この回までに残したことを、行き先ごとに。同じ題で後から書き直したものは、後の行き先になる。"), leftGroups(items, true)];
}
const leftCount = list => { const items = leftovers(list); return { all: items.length, left: items.filter(x => x.state === "left").length }; };

// What this section did and left, up to the chosen run: done runs, moved to a task, dropped, left behind.
function ledgerBlock(sid) {
  const list = upToChosen(), inSec = list.filter(n => n.section_id === sid), items = leftovers(list, sid);
  const left = items.filter(x => x.state === "left");
  if (!inSec.length) return [];
  const group = (name, xs, row) => xs.length > 0 && [h("div", { class: "ledger-h" }, `${name}（${xs.length}）`), xs.map(row)];
  return [
    left.length > 0 && h("div", { class: "chips" }, h("span", { class: "tag d-left" }, `${ICON.left} この範囲の置き去り `, h("b", { class: "num" }, left.length)),
      h("span", { class: "hint" }, "行き先（タスクか見送り）が決まっていない")),
    fold("ledger", `${ICON.ledger} この範囲の記録（${inSec.length} 回）`, [
      leftGroups(items, false),
      group(`${ICON.did} した回`, inSec, n => h("div", { class: "row lrow" }, mk(n.status), h("span", { class: "grow" }, n.title), h("span", { class: "tag num" }, fmt(n.finished_at)), goRun(n))),
    ]),
  ];
}

// ---- future: next and questions ----
function renderNext() {
  const s = snap.status, run = s.run, n = run.next, asks = run.asks || [];
  const isLatest = String(chosenId()) === String(latestId());
  const el = document.getElementById("next");
  const kids = [h("div", { class: "c3-h" }, h("span", { class: "ico", "aria-hidden": "true" }, ICON.next), h("h2", null, "未来"),
    h("span", { class: "sub" }, isLatest ? "次にやること・質問" : "この時点での予定")),];
  if (n) {
    kids.push(h("p", { class: "lead" }, h("span", { "aria-hidden": "true", style: "color:var(--accent)" }, "→"), h("span", null, n.title)));
    if (n.task) { const t = (s.tasks || []).find(x => x.id === n.task); if (t) kids.push(h("div", { class: "chips" }, h("span", { class: "tag" }, "タスク ", h("b", null, t.title)))); }
    if (n.detail || (n.steps || []).length) kids.push(fold("nextdetail", "くわしく・最初の手順", [n.detail && h("p", { class: "para" }, n.detail),
      (n.steps || []).length > 0 && h("ol", { class: "steps-ol" }, n.steps.map(x => h("li", null, x)))]));
  } else kids.push(h("p", { class: "hint" }, "次にやること（run.next）は書かれていません。"));
  if (asks.length) {
    if (isLatest) kids.push(asksBlock(asks));
    else kids.push(fold("pastasks", `${ICON.ask} このときの質問（${asks.length}）`, asks.map(a => h("div", { class: "ask past" }, h("div", { class: "ask-q" }, a.question),
      h("div", { class: "hint" }, a.options.map((o, i) => o + (a.recommended === i ? "（おすすめ）" : "")).join(" ／ "))))));
  } else if (isLatest) kids.push(h("div", { class: "hint" }, `${ICON.ask} 答えが要る質問はありません。`));
  if (!isLatest) {
    const all = nodes(), i = all.findIndex(x => String(x.id) === String(snap.id)), after = all[i + 1];
    if (after) kids.push(h("div", { class: "row", style: "border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap" },
      h("span", { class: "hint", style: "flex:none" }, "実際にこのあと:"), mk(after.status), h("span", { class: "grow" }, after.title),
      h("button", { class: "btn small", type: "button", onclick: () => choose(after.id === latestId() ? null : after.id) }, "そこへ ▶")));
  }
  put(el, ...kids);
}

function asksBlock(asks) {
  const fallback = h("textarea", { id: "copy-fallback", readonly: "", hidden: "" });
  const msg = h("span", { class: "hint", role: "status" }, "答えは自動では送られません。コピーして貼り付けます。");
  const text = () => asks.map(a => `${a.question} → ${answers[a.id] ?? "（未回答）"}`).join("\n");
  return h("div", { class: "fold-body", style: "padding-top:0" },
    asks.map(a => h("div", { class: "ask", role: "group", "aria-label": a.question },
      h("div", { class: "ask-q" }, `${ICON.ask} `, a.question),
      h("div", { class: "opts" }, a.options.map((o, i) => h("button", {
        class: "btn small", type: "button", "aria-pressed": answers[a.id] === o ? "true" : "false",
        onclick: e => { answers[a.id] = o; e.currentTarget.parentNode.querySelectorAll(".btn").forEach(b => b.setAttribute("aria-pressed", b === e.currentTarget)); }
      }, o, a.recommended === i && h("span", { class: "rec" }, "おすすめ")))))),
    h("div", { class: "ask-foot" },
      h("button", { class: "btn primary", type: "button", onclick: async () => {
        const t = text(); fallback.value = t;
        try { await navigator.clipboard.writeText(t); fallback.hidden = true; msg.textContent = "コピーしました。入力欄に貼り付けてください。"; }
        catch { fallback.hidden = false; fallback.select(); msg.textContent = "コピーできませんでした。下の文字を選んでコピーしてください。"; }
      } }, "答えをコピー"), msg),
    fallback);
}

// ---- choosing a point in time ----
async function loadSnap() {
  const id = chosenId();
  if (id === "now") { snap = { id: "now", status: latest, git: null }; return; }
  const r = await src.run(id);
  if (String(id) === String(latestId())) snap = { id, status: latest, git: r?.git || null };   // keep the file (it has history etc.)
  else snap = r ? { id, status: r.status, git: r.git } : { id, status: latest, git: null };
  if (!snap.status?.run) snap = { id, status: latest, git: null };
}
async function choose(id) {
  sel = id;
  openKeys.delete("diff");
  await loadSnap();
  render();
}
function render() {
  if (!latest) return;
  renderSignal(); renderFlow(); renderPast(); renderNow(); renderNext();
}

async function loadAll(keep) {
  const [st, ov] = await Promise.all([src.status(), src.overview()]);
  const sameRun = keep && latest && latest.run.id === st.run.id && latest.run.finished_at === st.run.finished_at;
  if (!sameRun) for (const k in answers) delete answers[k];
  latest = st; runs = prepRuns(ov || []);
  if (!keep || (sel != null && !runs.some(r => String(r.id) === String(sel)))) sel = null;
  document.getElementById("proj").textContent = st.project?.name || "";
  await loadSnap();
  render();
}

function showErr(t) { const e = document.getElementById("err"); e.textContent = t; e.hidden = !t; }
function valid(d) { return d && d.schema === "responseboard/status@1" && d.run && d.run.title && d.run.status; }

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try { const d = JSON.parse(r.result); if (!valid(d)) throw new Error("schema が responseboard/status@1 ではないか、run.title / run.status がありません。");
      liveInfo = null; fSection = fTask = null; src = bundleSource({ status: d, overview: [] }); showErr("");
      document.getElementById("sample-tag").hidden = true; await loadAll(false); }
    catch (x) { showErr(`${f.name} を読めませんでした: ${x.message}`); }
  };
  r.readAsText(f, "utf-8");
});

// Live mode: served by "rb serve" on this machine. Anywhere else (an Artifact, a file) shows the sample.
async function showProject(path, fresh) {
  src = liveSource(path);
  if (fresh) { sel = null; fSection = fTask = null; }
  const v = await api(`api/rev?${qp(path)}`);
  liveInfo = { path, rev: v.rev };
  await loadAll(!fresh);
}
async function poll() {
  if (!liveInfo || document.hidden) return;
  try {
    const { rev } = await api(`api/rev?${qp(liveInfo.path)}`);
    if (rev !== liveInfo.rev) await showProject(liveInfo.path, false);
    showErr("");
  } catch { showErr("rb serve とつながりません。rb serve が動いているか確かめてください。"); }
}
async function startLive() {
  const projects = await api("api/projects");
  if (!projects.length) throw new Error("記録された実行がまだありません。rb done などで 1 件記録してください。");
  const selEl = document.getElementById("proj-select");
  selEl.replaceChildren(...projects.map(p => h("option", { value: p.project_path }, `${STATUS[p.status]?.mark || "?"} ${p.project}（${p.runs} 件）`)));
  const saved = local.get("rb.project");
  selEl.value = projects.some(p => p.project_path === saved) ? saved : projects[0].project_path;
  selEl.hidden = false;
  document.getElementById("live-tag").hidden = false;
  document.getElementById("sample-tag").hidden = true;
  document.getElementById("proj").hidden = true;
  selEl.addEventListener("change", () => { local.set("rb.project", selEl.value); showProject(selEl.value, true); });
  await showProject(selEl.value, true);
  setInterval(poll, 3000);
}

const sample = () => { src = bundleSource(JSON.parse(document.getElementById("sample").textContent)); return loadAll(false); };
if (/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
  startLive().catch(e => { sample(); showErr(`ライブ表示にできませんでした: ${e.message}`); });
} else sample();
</script>
